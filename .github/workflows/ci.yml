name: Team CI Quality Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./customer-next

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: customer-next/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Validation
        run: npm run type-check

      - name: Run Next.js Production Build
        run: npm run build
