<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Journey Skeletons &amp; Structural Wireframes (Screens 1 to 10)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* STRICT MONOCHROME WIREFRAME / BLUEPRINT PALETTE (NO COLORS) */
    :root {
      --wire-bg: #f8fafc;
      --wire-card: #ffffff;
      --wire-border: #94a3b8;
      --wire-border-dark: #334155;
      --wire-border-dashed: #cbd5e1;
      --wire-text: #0f172a;
      --wire-text-muted: #64748b;
      --wire-surface-subtle: #f1f5f9;
      --wire-surface-contrast: #e2e8f0;
      --wire-black: #000000;
      --wire-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Master Top Control Console */
    .master-console {
      width: 100%;
      max-width: 1400px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .console-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .blueprint-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      background: #1f2937;
      border: 1px solid #4b5563;
      padding: 4px 8px;
      border-radius: 6px;
      color: #9ca3af;
      letter-spacing: 0.5px;
    }

    .console-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #f9fafb;
    }

    .view-mode-switch {
      display: flex;
      gap: 6px;
      background: #1f2937;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #374151;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: #9ca3af;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: #374151;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* Horizontal Screen Tabs */
    .screen-nav-bar {
      width: 100%;
      max-width: 1400px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
      scrollbar-width: thin;
    }

    .screen-tab-btn {
      white-space: nowrap;
      background: #1f2937;
      border: 1px solid #374151;
      color: #9ca3af;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .screen-tab-btn:hover {
      background: #374151;
      color: #ffffff;
    }

    .screen-tab-btn.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    /* Container for Flow Mode (Single Device Frame) */
    .device-stage {
      display: flex;
      justify-content: center;
      width: 100%;
      margin-bottom: 40px;
    }

    /* Container for Grid Mode (All 10 screens side-by-side) */
    .grid-stage {
      display: none;
      width: 100%;
      max-width: 1440px;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 28px;
      justify-items: center;
      margin-bottom: 40px;
    }

    /* Mobile Frame Wireframe Housing */
    .phone-mockup {
      width: 380px;
      height: 800px;
      background: #ffffff;
      border: 4px solid #334155;
      border-radius: 36px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      color: #0f172a;
      position: relative;
    }

    .grid-card-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .grid-card-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 800;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Screen Internals */
    .screen-housing {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      overflow-y: auto;
      background: #ffffff;
      position: relative;
      font-size: 13px;
    }

    /* Standardized Wireframe Elements */
    .wire-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 2px solid var(--wire-border-dark);
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .wire-box {
      border: 1.5px solid var(--wire-border);
      background: var(--wire-card);
      border-radius: 8px;
      padding: 10px;
    }

    .wire-box-dashed {
      border: 1.5px dashed var(--wire-border);
      background: var(--wire-surface-subtle);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--wire-text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
    }

    .wire-pill {
      border: 1.5px solid var(--wire-border);
      background: var(--wire-surface-subtle);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .wire-pill.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .wire-btn {
      width: 100%;
      background: #0f172a;
      color: #ffffff;
      border: 2px solid #0f172a;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .wire-btn-secondary {
      background: #ffffff;
      color: #0f172a;
      border: 1.5px solid #0f172a;
    }

    .wire-btn-outline {
      background: transparent;
      border: 1.5px solid var(--wire-border);
      color: var(--wire-text);
    }

    .wire-input-box {
      width: 100%;
      border: 1.5px solid var(--wire-border);
      background: #ffffff;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12.5px;
      color: #0f172a;
      font-family: inherit;
    }

    .wire-call-btn-small {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid #0f172a;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }

    .wire-sticky-bottom-bar {
      position: sticky;
      bottom: 0;
      background: #ffffff;
      border-top: 2px solid var(--wire-border-dark);
      padding: 10px 16px;
      z-index: 20;
    }

    .wire-badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border: 1px solid var(--wire-border);
      border-radius: 4px;
      background: var(--wire-surface-subtle);
    }

    /* Screen 2 Double Column Grid */
    .wire-double-column-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px 16px;
    }

    .grid-item-card {
      border: 1.5px solid var(--wire-border);
      border-radius: 12px;
      padding: 8px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .grid-item-img {
      width: 100%;
      height: 90px;
      border-radius: 8px;
      border: 1px dashed var(--wire-border);
      background: var(--wire-surface-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--wire-text-muted);
    }

    .grid-add-btn {
      width: 100%;
      border: 1.5px solid #0f172a;
      background: #ffffff;
      color: #0f172a;
      border-radius: 6px;
      padding: 5px 0;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }

    /* Structural Annotations Overlay */
    .structure-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      color: #64748b;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }
  </style>
</head>

              <button class="wire-btn wire-btn-outline" style="flex-direction:column; padding:16px 8px; gap:6px;" onclick="notifyWaiter('CUTLERY')">
                <span style="font-size:22px;">🍴</span>
                <span style="font-size:11px;">[CUTLERY]</span>
              </button>

              <button class="wire-btn wire-btn-outline" style="flex-direction:column; padding:16px 8px; gap:6px;" onclick="notifyWaiter('TABLE CLEAN')">
                <span style="font-size:22px;">🧹</span>
                <span style="font-size:11px;">[TABLE CLEAN]</span>
              </button>

              <button class="wire-btn" style="grid-column:1/-1; padding:14px;" onclick="notifyWaiter('GENERAL CALL')">
                <span style="font-size:18px;">🛎️</span>
                <span>[CALL WAITER TO TABLE]</span>
              </button>
            </div>

            <!-- Custom Text Option to Waiter -->
            <div class="wire-box">
              <div class="structure-label">[CUSTOM TEXT OPTION TO WAITER]</div>
              <textarea class="wire-input-box" rows="3" placeholder="[TYPE CUSTOM NOTE OR SPECIAL ASSISTANCE REQUEST...]" id="customWaiterText"></textarea>
              <button class="wire-btn wire-btn-secondary" style="margin-top:8px; padding:10px;" onclick="sendCustomWaiterNote()">
                <span>✉️</span>
                <span>[SEND CUSTOM MESSAGE TO WAITER]</span>
              </button>
            </div>

            <!-- Real-Time Request Status Confirmation -->
            <div class="wire-box" id="waiterAckBox" style="display:none; text-align:center; background:#f1f5f9;">
              <div style="font-weight:800; font-size:12px;">✓ [WAITER NOTIFIED]</div>
              <div style="font-size:10.5px; color:#64748b;" id="waiterAckText">[REQUEST TRANSMITTED TO FLOOR SERVER]</div>
            </div>
          </div>

          <!-- Bottom Sticky: Back to Dining Menu -->
          <div class="wire-sticky-bottom-bar">
            <button class="wire-btn" onclick="showScreen(2)">
              <span>[BACK TO MENU]</span>
            </button>
          </div>
        </div>
      `
    };

    let activeScreen = 1;

    function showScreen(screenNum, tabBtn = null) {
      activeScreen = screenNum;

      // Update interactive single mockup
      const phoneContainer = document.getElementById('interactivePhone');
      if (phoneContainer) {
        phoneContainer.innerHTML = screensHtml[screenNum];
      }

      // Update screen navigation tabs
      const tabs = document.querySelectorAll('.screen-tab-btn');
      tabs.forEach((t, idx) => {
        if (idx + 1 === screenNum) t.classList.add('active');
        else t.classList.remove('active');
      });
    }

    function setViewMode(mode) {
      const btnFlow = document.getElementById('btnModeFlow');
      const btnGrid = document.getElementById('btnModeGrid');
      const flowStage = document.getElementById('deviceStage');
      const gridStage = document.getElementById('gridStage');

      if (mode === 'flow') {
        btnFlow.classList.add('active');
        btnGrid.classList.remove('active');
        flowStage.style.display = 'flex';
        gridStage.style.display = 'none';
        showScreen(activeScreen);
      } else {
        btnGrid.classList.add('active');
        btnFlow.classList.remove('active');
        flowStage.style.display = 'none';
        gridStage.style.display = 'grid';
        renderGrid();
      }
    }

    function renderGrid() {
      const gridStage = document.getElementById('gridStage');
      gridStage.innerHTML = '';

      const labels = [
        '1. WELCOME & WI-FI',
        '2. MENU & 2-COL GRID',
        '3. DETAILED ITEM PAGE',
        '4. CART & SEPARATE ORDERS',
        '5. LIVE TRACKING',
        '6. PAYMENT 1 (SPLIT & TIPS)',
        '7. PAYMENT 2 (GATEWAY & QR)',
        '8. CONFIRMATION & REVIEWS',
        '9. DETAILED BILL & SHARE',
        '10. WAITER CALL CONSOLE'
      ];

      for (let i = 1; i <= 10; i++) {
        const wrap = document.createElement('div');
        wrap.className = 'grid-card-wrap';
        wrap.innerHTML = `
          <div class="grid-card-label">${labels[i-1]}</div>
          <div class="phone-mockup" style="box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            ${screensHtml[i]}
          </div>
        `;
        gridStage.appendChild(wrap);
      }
    }

    function notifyWaiter(serviceType) {
      const box = document.getElementById('waiterAckBox');
      const text = document.getElementById('waiterAckText');
      if (box && text) {
        box.style.display = 'block';
        text.innerText = '[' + serviceType + ' REQUEST SENT TO FLOOR SERVER]';
      }
      alert('[' + serviceType + ' REQUEST SENT TO FLOOR SERVER]');
    }

    function sendCustomWaiterNote() {
      const txt = document.getElementById('customWaiterText');
      const val = txt ? txt.value.trim() : '';
      if (!val) {
        alert('[PLEASE ENTER A MESSAGE]');
        return;
      }
      alert('[CUSTOM MESSAGE TRANSMITTED: ' + val + ']');
      const box = document.getElementById('waiterAckBox');
      const text = document.getElementById('waiterAckText');
      if (box && text) {
        box.style.display = 'block';
        text.innerText = '[CUSTOM NOTE SENT: "' + val + '"]';
      }
    }

    // Auto initialize to Screen 1
    window.addEventListener('DOMContentLoaded', () => {
      showScreen(1);
    });
  </script>
</body>
</html>
